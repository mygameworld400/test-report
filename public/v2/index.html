<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ME 연애 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root{color-scheme:light;
    --ground:#FBF6F1;--surface:#FFF;--ink:#3A2530;--ink-soft:#6E5A61;--muted:#9C8A8F;
    --rose:#C2607A;--rose-deep:#A44863;--blush:#F6E4E8;--gold:#C4A05E;--gold-soft:#E7D3A8;
    --line:#EADFD7;--amber:#C9761B;--amber2:#E9A23B;
    --shadow:0 14px 32px rgba(90,45,60,.10);--shadow-sm:0 6px 18px rgba(90,45,60,.07);}
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:430px;margin:0 auto;padding:0 22px;min-height:100%;}
  .serif{font-family:'Nanum Myeongjo',Georgia,serif}.fr{font-family:'Fraunces',Georgia,serif}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-deep);font-weight:600}
  .gold-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .btn{display:block;width:100%;text-align:center;border:none;color:#fff;font-weight:600;font-size:16px;
    background:linear-gradient(135deg,var(--rose),var(--rose-deep));padding:17px;border-radius:999px;
    box-shadow:0 12px 26px rgba(164,72,99,.3)}
  .fade{animation:f .28s ease-out}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}

  /* intro */
  .intro{display:flex;flex-direction:column;min-height:100dvh;text-align:center;padding-block:36px}
  .intro .hero{flex:1;display:flex;flex-direction:column;justify-content:center}
  .kick{display:inline-flex;gap:9px;align-items:center;color:var(--muted);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;justify-content:center}
  .kick::before,.kick::after{content:'';width:20px;height:1px;background:var(--gold);opacity:.7}
  h1.title{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:40px;line-height:1.18;margin:14px 0 0}
  h1.title em{font-style:normal;color:var(--rose-deep)}
  .mark{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:.5em;color:var(--rose-deep);margin-top:6px}
  .sub{margin:18px auto 0;max-width:19em;color:var(--ink-soft);font-size:15px;line-height:1.85}
  .sub b{color:var(--ink);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 6px;box-shadow:var(--shadow-sm)}
  .stat .n{font-family:'Fraunces',serif;font-weight:600;font-size:28px}.stat .l{margin-top:6px;font-size:11px;color:var(--muted)}

  /* quiz */
  .pbar{position:sticky;top:0;background:var(--ground);padding:20px 0 14px;z-index:5}
  .pmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .pcur{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--rose-deep)}
  .pcur small{color:var(--muted);font-weight:400}.ppct{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .track{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .3s}
  .cat{margin:24px 0 12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-deep);font-weight:600}
  h2.q{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;line-height:1.42;margin:0 0 24px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px;width:100%;transition:all .15s}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:13px;background:var(--blush);color:var(--rose-deep);margin-top:1px}
  .opt .t{font-size:14.5px;line-height:1.6;color:var(--ink)}
  .opt.sel{border-color:var(--rose);background:linear-gradient(180deg,#fff,var(--blush));box-shadow:var(--shadow)}
  .opt.sel .k{background:var(--rose);color:#fff}
  .otherbtn{margin-top:14px;width:100%;border:1px dashed #E0B9C4;color:var(--rose-deep);font-weight:500;font-size:13.5px;border-radius:16px;padding:13px;background:transparent}
  .otherbox{margin-top:12px;background:var(--blush);border:1px solid #E6CBD3;border-radius:16px;padding:14px}
  .otherbox p{margin:0 0 8px;font-size:12.5px;color:var(--ink-soft)}
  .otherbox textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:13.5px;resize:none}
  .nav{position:sticky;bottom:0;background:rgba(251,246,241,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin:20px -22px 0;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px))}
  .navin{display:flex;gap:11px}
  .prev{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:14px 22px;font-weight:500;font-size:14px}
  .next{flex:1;border:none;color:#fff;border-radius:999px;padding:14px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));box-shadow:0 10px 22px rgba(164,72,99,.28)}
  .next:disabled{opacity:.4}

  /* intermission */
  .inter{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70dvh;text-align:center}
  .inter .em{font-size:60px;margin-bottom:16px}.inter h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;margin:0 0 8px}
  .inter p{color:var(--muted);margin:0 0 28px;max-width:16em}

  /* result */
  section.rs{padding:30px 0;border-top:1px solid var(--line)}
  .cover{padding:34px 0 28px;text-align:center}
  .emblem{width:92px;height:92px;margin:22px auto 0;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .emblem::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.45)}
  .emblem span{font-family:'Fraunces',serif;font-weight:600;font-size:42px;color:#fff;position:relative;text-shadow:0 2px 8px rgba(120,60,10,.35)}
  .aen{margin-top:18px;font-family:'Fraunces',serif;font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
  .ako{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:50px;line-height:1.05;margin:6px 0 0}
  .atag{margin:14px 0 0;font-family:'Nanum Myeongjo',serif;font-size:17px;font-style:italic;color:var(--ink-soft)}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .chip{font-size:11.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;box-shadow:var(--shadow-sm)}
  .chip b{color:var(--rose-deep)}.chip .fr{color:var(--ink);font-weight:600}
  .pull{font-family:'Nanum Myeongjo',serif;font-size:21px;line-height:1.6;color:var(--ink)}
  .pull .qq{color:var(--gold);font-size:30px;font-family:'Fraunces',serif;vertical-align:-6px}
  .ess{margin-top:14px;color:var(--ink-soft);font-size:14.5px;line-height:1.9}
  .sh{display:flex;align-items:center;gap:12px;margin:0 0 16px}
  .sh .no{font-family:'Fraunces',serif;font-size:12px;color:var(--gold)}.sh h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:19px;margin:0}
  .signote{color:var(--muted);font-size:12.5px;margin:-6px 0 18px}
  .sigrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
  .sigrow:last-child{border-bottom:none}
  .signum{font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:.9}
  .signum sup{font-size:14px;font-weight:500;color:var(--muted)}
  .siglab{font-weight:600;font-size:15px}.sigbadge{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;font-weight:600;margin-left:8px}
  .bd-high{background:var(--blush);color:var(--rose-deep)}.bd-low{background:#EAEEF3;color:#5E6C82}
  .sigtext{margin:7px 0 0;color:var(--ink-soft);font-size:13.5px;line-height:1.6}
  .contrast{margin-top:16px;background:#F6EFE7;border:1px solid #ECDCC6;border-radius:14px;padding:13px 15px;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
  .contrast b{color:var(--ink)}
  .freetag{font-family:'Fraunces',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .pattern{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .pattern .pt{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;color:var(--rose-deep)}
  .pattern .px{margin:10px 0 0;font-family:'Nanum Myeongjo',serif;font-size:18px;line-height:1.6;color:var(--ink)}
  .lovehead{display:flex;gap:14px;align-items:center;margin-bottom:16px}.lovehead .em{font-size:32px}
  .lovehead .bg{font-family:'Fraunces',serif;font-weight:600;font-size:15px}.lovehead p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
  .lg h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 10px;font-weight:600}
  .bar{display:grid;grid-template-columns:74px 1fr 30px;gap:10px;align-items:center;margin-bottom:9px}
  .bar .bl{font-size:12.5px;color:var(--ink-soft)}.bar .tk{height:7px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar .fl{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--rose-deep))}
  .bar.top .fl{background:linear-gradient(90deg,var(--amber2),var(--amber))}
  .bar .bv{font-family:'Fraunces',serif;font-size:13px;text-align:right}.bar.zero .bl,.bar.zero .bv{color:#C4B3B8}
  .lock{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:9px}
  .lock .ic{flex:none;width:28px;height:28px;border-radius:8px;background:#F1E7EC;display:grid;place-items:center;color:var(--rose-deep)}
  .lock .lt{font-size:14px;font-weight:500}.lock .lk{margin-left:auto;color:var(--muted)}
  .unlock{margin-top:20px;border-radius:22px;padding:26px 22px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#2E1D26,#43222F);box-shadow:0 20px 44px rgba(58,30,45,.34)}
  .unlock .ue{font-family:'Fraunces',serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-soft)}
  .unlock h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;margin:12px 0 0;color:#fff}
  .unlock p{margin:12px 0 0;font-size:13px;color:#E9D9DF;line-height:1.7}
  .price{margin:18px 0 2px}.price .was{color:#B9A0A9;text-decoration:line-through;font-size:14px;margin-right:8px}
  .price .now{font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:#fff}.price .cu{font-size:14px;color:#E9D9DF;margin-left:2px}
  .ubtn{margin-top:16px;width:100%;border:none;border-radius:999px;padding:15px;font-weight:700;font-size:15px;color:var(--ink);background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .again{margin-top:18px;display:flex;gap:10px}
  .again button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:14px;padding:13px;font-weight:500;font-size:13.5px}
  .disc{margin-top:22px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:40}

  /* home menu */
  .home-head{text-align:center;padding:44px 0 8px}
  .report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
  .report-card{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 8px;box-shadow:var(--shadow-sm);text-align:center}
  .report-card .rc-emoji{font-size:24px}
  .report-card .rc-name{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:13px;color:var(--ink)}
  .report-card .rc-desc{font-size:10.5px;color:var(--muted);line-height:1.4}
  .report-card.soon{opacity:.55}
  .report-card:active{transform:scale(.98)}

  /* profile (placeholder) */
  .profile-head{text-align:center}
  .profile-avatar{width:68px;height:68px;margin:0 auto;border-radius:50%;background:var(--blush);display:grid;place-items:center;font-size:30px}
  .profile-list{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 16px;box-shadow:var(--shadow-sm)}
  .profile-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
  .profile-row:last-child{border-bottom:none}
  .profile-row .pv{color:var(--muted)}

  /* bottom tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,246,241,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar-inner{max-width:430px;margin:0 auto;display:flex}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:10px 0 8px;color:var(--muted);font-size:11px}
  .tab .ti{font-size:20px;line-height:1}
  .tab.on{color:var(--rose-deep)}
  .back-home{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px;background:none;border:none;padding:16px 0 0;cursor:pointer}
  .beta-btn{display:block;width:100%;text-align:center;margin-top:10px;border:1.5px dashed var(--gold);color:var(--amber);font-weight:600;font-size:14px;
    background:transparent;padding:14px;border-radius:999px}
  .quit-link{display:block;margin:8px 0 0 auto;background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}

  /* dashboard product list */
  .sec-label{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
  .prod-list{display:flex;flex-direction:column;gap:9px}
  .prod-row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow-sm)}
  .pr-ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--blush);display:grid;place-items:center;font-size:17px}
  .pr-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .pr-name{font-weight:600;font-size:14px;color:var(--ink)}
  .pr-desc{font-size:11.5px;color:var(--muted)}
  .pr-state{flex:none;font-size:11.5px;font-weight:700;color:var(--rose-deep);background:var(--blush);border-radius:999px;padding:5px 10px}

  /* people / person cards */
  .people-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .person-card{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--blush);color:var(--rose-deep);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .pc-body{flex:1}
  .pc-name{font-weight:600;font-size:14px}
  .pc-tag{font-size:11.5px;color:var(--muted)}
  .badge{font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:999px;flex:none}
  .badge.direct{background:var(--blush);color:var(--rose-deep)}
  .badge.observed{background:#F6EFE7;color:var(--amber)}
  .pc-remove{border:none;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px;flex:none}
  .add-person-btn{width:100%;padding:15px;border-radius:16px;border:1.5px dashed var(--gold);background:transparent;color:var(--rose-deep);font-weight:600;font-size:14px;cursor:pointer;margin-top:12px}
  .chip-row{display:flex;gap:8px}
  .chip{flex:1;padding:11px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{border-color:var(--rose);background:var(--blush);color:var(--rose-deep)}
  .mode-choice{display:flex;gap:8px;margin-top:10px}
  .mode-card{flex:1;text-align:left;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
  .mode-card.on{border-color:var(--rose);background:var(--blush)}
  .mode-card .mt{font-weight:700;font-size:12.5px;margin-bottom:3px}
  .mode-card .md{font-size:10.5px;color:var(--muted);line-height:1.4}
  .invite-box{margin-top:16px;background:var(--blush);border:1px solid #E6CBD3;border-radius:16px;padding:16px}
  .invite-link-row{display:flex;gap:8px;align-items:center;margin:10px 0}
  .invite-link-row code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:10.5px}

  /* compare / metric rows (MATCH·CRUSH·PAIR) */
  .compare-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:18px;margin-bottom:12px}
  .compare-who{font-weight:700;font-family:'Nanum Myeongjo',serif;font-size:16px;margin-bottom:10px}
  .compare-note{font-size:13px;color:var(--ink-soft);line-height:1.65;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .metric-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .metric-label{font-size:11.5px;color:var(--ink-soft);width:90px;flex:none}
  .metric-bar{flex:1;height:6px;background:var(--blush);border-radius:99px;overflow:hidden}
  .metric-bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:99px}
  .metric-val{width:26px;text-align:right;font-size:11.5px;font-weight:700}
  .locked-card{opacity:.6}
  .folded-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .folded-item{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
  .folded-n{font-size:13px;font-weight:600}
  .folded-d{font-size:11px;color:var(--muted)}

  /* purchase sheet */
  .sheet-overlay{position:fixed;inset:0;background:rgba(58,37,48,.45);z-index:40}
  .sheet2{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
  .sheet2 h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:19px;margin:0 0 4px}
  .sheet2 .sub2{color:var(--ink-soft);font-size:13px;margin:0 0 14px}
  .sheet2 .price2{margin:6px 0 14px}
  .sheet2 .price2 .was{color:var(--muted);text-decoration:line-through;font-size:13px;margin-right:7px}
  .sheet2 .price2 .now{font-family:'Fraunces',serif;font-weight:700;font-size:22px;color:var(--rose-deep)}
  .sheet-note{font-size:11.5px;color:var(--muted);background:var(--ground);border-radius:12px;padding:10px 12px;margin-top:12px;line-height:1.55}

  /* impact / misread (PAIR) */
  .impact-cols{display:flex;gap:9px;margin-top:2px}
  .impact-col{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px}
  .impact-col h4{margin:0 0 9px;font-size:11.5px;color:var(--ink-soft);font-weight:700}
  .impact-item{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0}
  .impact-pos{color:var(--rose-deep);font-weight:700}
  .misread-card{background:#F6EFE7;border:1px solid #ECDCC6;border-radius:14px;padding:13px 15px;margin-top:9px}
  .misread-t{font-weight:700;font-size:12.5px;margin-bottom:4px;color:var(--amber)}
  .misread-card p{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.55}

  /* admin */
  .admin-stat-grid{display:flex;gap:9px;margin:18px 0}
  .admin-stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:center}
  .admin-stat .al{font-size:10.5px;color:var(--muted);font-weight:700}
  .admin-stat .av{font-size:20px;font-weight:800;margin-top:5px;color:var(--rose-deep);font-family:'Fraunces',serif}

ore":{"stability":3}},{"id":"D","text":"새로운 경험이나 변화를 즐기는 편이다.","score":{"stability":-2,"flexibility":2}}],"allowed":["future","stability","flexibility"]},{"id":"OBS_12","category":"연락·거리","prompt":"{name}은(는) 평소 연락 빈도는 어떤 편인가요?","options":[{"id":"A","text":"자주 연락하며 이어져 있고 싶어하는 편이다.","score":{"contact":3,"intimacy":2}},{"id":"B","text":"적당한 정도로 연락하는 편이다.","score":{"contact":1}},{"id":"C","text":"연락이 뜸해도 괜찮아하는 편이다.","score":{"contact":-2,"personalSpace":2}},{"id":"D","text":"정해진 루틴처럼 연락하는 걸 답답해하는 편이다.","score":{"contact":-2,"stability":-1}}],"allowed":["contact","intimacy","personalSpace","stability"]},{"id":"OBS_13","category":"관계운영","prompt":"{name}은(는) 의견이 다를 때 보통 어떻게 하나요?","options":[{"id":"A","text":"중간 지점을 찾아 조율하려는 편이다.","score":{"flexibility":3}},{"id":"B","text":"자기 기준을 잘 지키려는 편이다.","score":{"boundary":2,"flexibility":-1}},{"id":"C","text":"설득하려는 편이다.","score":{"leadership":2,"solution":1}},{"id":"D","text":"큰 문제 아니면 맞춰주는 편이다.","score":{"flexibility":2}}],"allowed":["flexibility","boundary","leadership","solution"]},{"id":"OBS_14","category":"미래·위기","prompt":"{name}은(는) 약속을 어겼을 때 이후 모습은 어떤가요?","options":[{"id":"A","text":"행동으로 신뢰를 다시 쌓으려고 하는 편이다.","score":{"repair":3}},{"id":"B","text":"말로 설명하고 넘어가려는 편이다.","score":{"repair":1,"accountability":1}},{"id":"C","text":"같은 일이 반복되는 편이다.","score":{"repair":-2,"trustOpen":-1}},{"id":"D","text":"스스로도 신경 쓰며 달라지려는 모습을 보인다.","score":{"repair":2,"accountability":2}}],"allowed":["repair","accountability","trustOpen"]}]};</script>
<script>
(function(){
  const $=(h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
  const app=document.getElementById('app');
  const KEY='me_full_v1';
  const Q=DATA.questions, CK=DATA.coreKeys, LK=DATA.loveKeys, CENT=DATA.centroids, META=DATA.meta, BANDS=DATA.bands;
  const CLAB=DATA.coreLabels, LLAB=DATA.loveLabels;
  const OBSQ=DATA.obsQuestions;
  const qById=Object.fromEntries(Q.map(q=>[q.id,q]));
  const allById=Object.fromEntries([...Q,...OBSQ].map(q=>[q.id,q]));

  // ---- 순서: 카테고리 분산(greedy) ----
  function buildOrder(){
    const cats=[],b={};
    Q.forEach(q=>{if(!b[q.category]){b[q.category]=[];cats.push(q.category);}b[q.category].push(q.id);});
    const cur={};cats.forEach(c=>cur[c]=0);const order=[];let prev=null;
    for(let s=0;s<Q.length;s++){
      let rem=cats.map(c=>({c,left:b[c].length-cur[c]})).filter(x=>x.left>0);
      let pool=rem.filter(x=>x.c!==prev); if(!pool.length)pool=rem;
      pool.sort((a,z)=>z.left-a.left||cats.indexOf(a.c)-cats.indexOf(z.c));
      const pick=pool[0].c;order.push(b[pick][cur[pick]++]);prev=pick;
    }
    return order;
  }
  // ---- state ----
  function sampleIds(n){
    const a=Q.map(q=>q.id);
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    return a.slice(0,n);
  }
  function fresh(mode,opts={}){
    const beta=mode==='beta', obs=mode==='observed';
    const order=obs?OBSQ.map(q=>q.id):(beta?sampleIds(10):buildOrder());
    return {answers:{},idx:0,order,inter:null,beta,flow:opts.flow||'normal',forPerson:opts.forPerson||null,nameToken:opts.nameToken||null,inviteToken:opts.inviteToken||null};
  }
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.order)&&s.order.length>0)return s;}catch(e){}return null;}
  function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
  let S=load();
  let Page='home'; // 'home' | 'profile' | 'love' | 'friend' | 'career'

  // ---- 계산 (범용: 문항 목록 + 답변 맵을 받는 버전) ----
  function rangesFor(keys,qlist){const mn={},mx={};keys.forEach(k=>{mn[k]=0;mx[k]=0;});
    qlist.forEach(q=>{keys.forEach(k=>{const v=q.options.map(o=>+(o.score[k]||0));mn[k]+=Math.min(...v);mx[k]+=Math.max(...v);});});return{mn,mx};}
  function rawFor(keys,answers,qlist){const r={};keys.forEach(k=>r[k]=0);
    const byId=Object.fromEntries(qlist.map(q=>[q.id,q]));
    Object.entries(answers).forEach(([qid,a])=>{const q=byId[qid];if(!q)return;const opt=q.options.find(o=>o.id===a.optionId);if(!opt)return;keys.forEach(k=>r[k]+=+(opt.score[k]||0));});return r;}
  function normFor(keys,answers,qlist){const rg=rangesFor(keys,qlist),rw=rawFor(keys,answers,qlist),n={};keys.forEach(k=>{const lo=rg.mn[k],hi=rg.mx[k];let v=hi===lo?50:((rw[k]-lo)/(hi-lo))*100;n[k]=Math.max(0,Math.min(100,v));});return n;}
  // ---- 계산 (현재 진행 중인 S 기준 — 기존 코드 호환용 래퍼) ----
  function ranges(keys){return rangesFor(keys,Q);}
  function raw(keys){return rawFor(keys,S.answers,Q);}
  function norm(keys){return normFor(keys,S.answers,Q);}
  function band(v){return v<=20?0:v<=40?1:v<=60?2:v<=80?3:4;}
  function rms(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s/a.length);}
  function classify(nc){const uv=CK.map(k=>nc[k]);
    const rank=Object.entries(CENT).map(([k,c])=>({k,label:c.label,dist:rms(uv,c.vector)})).sort((a,b)=>a.dist-b.dist);
    rank.forEach(r=>r.sim=Math.max(0,Math.min(100,100-r.dist)));
    const gap=rank[1].dist-rank[0].dist;const blend=gap<2?'복합형':gap<5?'혼합형':gap<9?'뚜렷한 편':'뚜렷한 유형';
    return{primary:rank[0],secondary:rank[1],blend,rank};}
  function signature(nc){
    const e=CK.map(k=>({k,value:nc[k],dist:Math.abs(nc[k]-50),band:band(nc[k])}));
    const highs=e.filter(x=>x.band>=3).sort((a,b)=>b.value-a.value);
    const lows=e.filter(x=>x.band<=1).sort((a,b)=>a.value-b.value);
    const byd=[...e].sort((a,b)=>b.dist-a.dist||CK.indexOf(a.k)-CK.indexOf(b.k));
    const ch=[],add=x=>{if(x&&!ch.find(c=>c.k===x.k))ch.push(x);};
    add(highs[0]);add(lows[0]);byd.forEach(x=>{if(ch.length<3)add(x);});
    return ch.slice(0,3).map(x=>({label:CLAB[x.k],value:Math.round(x.value),dir:x.band>=3?'high':x.band<=1?'low':'mid',text:BANDS[x.k][x.band]}));
  }
  const RULES=[
    {id:'a',t:'가까움과 거리, 둘 다',c:[['intimacy','h'],['personalSpace','h']],x:'깊게 사랑하고 싶지만, 사랑한다고 항상 붙어 있어야 한다고 생각하지는 않습니다.'},
    {id:'b',t:'확인은 필요하지만 표현은 아껴요',c:[['reassurance','h'],['emotionExpression','l']],x:'상대의 표현은 많이 필요하지만 자신의 감정은 상대적으로 덜 드러내는 편입니다.'},
    {id:'c',t:'피하진 않지만 서두르지도 않아요',c:[['conflictDirect','h'],['cooldown','h']],x:'문제를 피하지는 않지만 감정이 정리되지 않은 상태에서 바로 싸우는 것도 원하지 않습니다.'},
    {id:'d',t:'위로보다 해결이 먼저',c:[['solution','h'],['empathy','l']],x:'상대가 힘들어하면 위로보다 해결 방법이 먼저 떠오르는 편입니다.'},
    {id:'e',t:'쉽게 믿진 않지만 쉽게 포기도 안 해요',c:[['trustOpen','l'],['repair','h']],x:'쉽게 믿지는 않지만 한번 관계를 시작하면 쉽게 포기하지 않는 편입니다.'},
    {id:'f',t:'선은 분명하게',c:[['boundary','h'],['flexibility','l']],x:'맞춰줄 수 있는 부분은 많지만, 한번 정한 선만큼은 잘 양보하지 않습니다.'},
    {id:'g',t:'방향을 잡는 사람',c:[['leadership','h'],['solution','h']],x:'관계가 흔들릴 때 방향을 제시하고 문제를 정리하는 역할을 자주 맡습니다.'},
    {id:'h',t:'멀리 보는 안정',c:[['future','h'],['stability','h']],x:'지금의 설렘만큼이나 이 관계가 오래 안정적으로 갈 수 있는지를 중요하게 봅니다.'},
    {id:'i',t:'연결되고 싶지만 통제는 싫어요',c:[['contact','h'],['privacy','h']],x:'자주 연결되어 있고 싶지만, 그것이 서로를 확인하고 통제하는 방식이 되는 건 원하지 않습니다.'},
    {id:'j',t:'맞춰주는 다정함',c:[['empathy','h'],['flexibility','h']],x:'상대의 감정을 먼저 읽고, 부딪히기보다 맞춰가며 관계를 부드럽게 유지합니다.'}
  ];
  function insights(nc){return RULES.filter(r=>r.c.every(([k,d])=>d==='h'?band(nc[k])>=3:band(nc[k])<=1));}

  // ---- 신원(로그인 없는 익명 모델) ----
  function getOwnerId(){let id=localStorage.getItem('tr_owner_id');if(!id){id=crypto.randomUUID();localStorage.setItem('tr_owner_id',id);}return id;}
  function getNickname(){return localStorage.getItem('tr_nickname')||'';}
  function setNickname(n){localStorage.setItem('tr_nickname',n.trim());getOwnerId();}
  function hasNickname(){return !!getNickname();}
  const ADMIN_CODE='reportstudio-admin';
  function isAdmin(){return sessionStorage.getItem('tr_admin')==='1';}
  function tryAdminLogin(code){const ok=code.trim()===ADMIN_CODE;if(ok)sessionStorage.setItem('tr_admin','1');return ok;}

  // ---- Supabase (psychtest와 같은 프로젝트를 tr_ 접두사로 공유) ----
  const sb=window.supabase?window.supabase.createClient('https://fbemzeslbvweojmgvohv.supabase.co','sb_publishable_dErg2UZWZQjifyAgO5-ejg_5AH563FV'):null;
  function genCode(){return crypto.randomUUID().replace(/-/g,'').slice(0,8);}

  async function saveAssessment(answers,{mode='self',personId=null}={}){
    const id=genCode();
    if(!sb)return id;
    const{error}=await sb.from('tr_assessments').insert({id,owner_id:getOwnerId(),person_id:personId,mode,answers});
    if(error)throw error;
    return id;
  }
  async function loadAssessment(id){
    if(!sb)return null;
    const{data,error}=await sb.from('tr_assessments').select('id,answers,mode').eq('id',id).maybeSingle();
    if(error||!data)return null;
    return data;
  }

  // ---- 상품/구매 ----
  const PRODUCTS={
    ME_FULL:{sku:'ME_FULL',name:'ME 전체 리포트',desc:'10개 심층 섹션과 18개 수치 전체 공개',list:4900,sale:1900},
    PERSON_SLOT:{sku:'PERSON_SLOT',name:'사람 추가 (최대 3명)',desc:'썸·연인·전 연인 프로필 등록',list:4900,sale:1900},
    MATCH_FULL:{sku:'MATCH_FULL',name:'MATCH 전체 리포트',desc:'나에게 맞는 상대 10개 섹션 전체 공개',list:4900,sale:1900},
    CRUSH:{sku:'CRUSH',name:'CRUSH 비교',desc:'썸 상대들과 각각 어떤 연애가 될지 비교',list:9900,sale:5900},
    PAIR:{sku:'PAIR',name:'PAIR 궁합 분석',desc:'연인과의 실제 궁합 심층 분석',list:9900,sale:5900},
  };
  async function purchase(sku){
    if(!sb)return;
    const p=PRODUCTS[sku];
    const{error}=await sb.from('tr_purchases').insert({owner_id:getOwnerId(),sku,amount:p.sale});
    if(error)throw error;
  }
  async function listEntitlements(){
    if(!sb)return[];
    const{data}=await sb.from('tr_purchases').select('sku').eq('owner_id',getOwnerId());
    return[...new Set((data||[]).map(r=>r.sku))];
  }
  async function isUnlocked(sku){return(await listEntitlements()).includes(sku);}

  // ---- 사람(PERSON) ----
  const MAX_PERSONS=3;
  async function listPersons(){
    if(!sb)return[];
    const{data}=await sb.from('tr_persons').select('id,display_name,relationship_label,response_mode,created_at').eq('owner_id',getOwnerId()).order('created_at');
    return data||[];
  }
  async function createPerson({name,relation,mode}){
    if(!sb)throw new Error('서버 연결이 설정되지 않았어요.');
    const existing=await listPersons();
    if(existing.length>=MAX_PERSONS)throw new Error(`사람은 최대 ${MAX_PERSONS}명까지 추가할 수 있어요.`);
    const{data:person,error}=await sb.from('tr_persons').insert({owner_id:getOwnerId(),display_name:name.trim(),relationship_label:relation,response_mode:mode}).select().single();
    if(error)throw error;
    if(mode!=='direct')return{person,inviteToken:null};
    const token=crypto.randomUUID().replace(/-/g,'');
    await sb.from('tr_invites').insert({token,owner_id:getOwnerId(),person_id:person.id});
    return{person,inviteToken:token};
  }
  async function deletePerson(id){if(!sb)return;await sb.from('tr_persons').delete().eq('id',id).eq('owner_id',getOwnerId());}
  async function resolveInvite(token){
    if(!sb)return null;

  // ---- PAIR/CRUSH 궁합 엔진 (18개 코어수치 기준) ----
  const PAIR_CATEGORIES=[
    {category:'연락·거리 궁합',kind:'similarity',dims:['contact','personalSpace','privacy','intimacy']},
    {category:'신뢰·경계 궁합',kind:'similarity',dims:['trustOpen','boundary']},
    {category:'갈등 해결 궁합',kind:'similarity',dims:['conflictDirect','cooldown']},

  ];
  function catOf(dim){return PAIR_CATEGORIES.find(c=>c.dims.includes(dim))?.category||dim;}
  function simScore(a,b){return Math.round(100-Math.abs(a-b));}
  function compScore(gap){if(gap>=20&&gap<=45)return 90;if(gap<20)return Math.round(60-(20-gap)*1.5);return Math.round(Math.max(0,90-(gap-45)*1.2));}
  const RISK_RULES=[
    {a:'conflictDirect',b:'cooldown',th:80,label:'추격-회피 충돌',detail:'한 명은 갈등을 그 자리에서 풀고 싶어 하고, 다른 한 명은 혼자 정리할 시간이 필요해요.'},
    {a:'privacy',b:'reassurance',th:80,label:'확인 욕구 충돌',detail:'한 명은 사생활을 지키고 싶어 하고, 다른 한 명은 자주 확인받고 싶어 해요.'},
    {a:'leadership',b:'leadership',th:75,label:'주도권 충돌',detail:'둘 다 방향을 직접 정하고 싶어 해서, 결정권을 두고 반복적으로 부딪힐 수 있어요.'},
  ];
  function findRisk(a,b){
    const out=[];
    for(const r of RISK_RULES){
      const av=a[r.a],bv=b[r.b],ar=a[r.b],br=b[r.a];
      const hit=(av!==undefined&&bv!==undefined&&av>=r.th&&bv>=r.th)||(ar!==undefined&&br!==undefined&&ar>=r.th&&br>=r.th);
      if(hit)out.push({label:r.label,detail:r.detail});
    }
    return out;
  }
  function computePair(a,b){
    const rows=[];
    for(const c of PAIR_CATEGORIES)for(const dim of c.dims){
      const av=a[dim],bv=b[dim];if(av===undefined||bv===undefined)continue;
      const score=c.kind==='similarity'?simScore(av,bv):compScore(Math.abs(av-bv));
      rows.push({dimension:dim,category:c.category,a:av,b:bv,score});
    }
    const overallScore=rows.length?Math.round(rows.reduce((s,r)=>s+r.score,0)/rows.length):0;
    const byCat={};for(const r of rows){(byCat[r.category]=byCat[r.category]||[]).push(r);}
    const categories=Object.entries(byCat).map(([category,rs])=>({category,score:Math.round(rs.reduce((s,r)=>s+r.score,0)/rs.length)}));
    return{rows,categories,overallScore,frictions:findRisk(a,b)};
  }
  const IMPACT_RULES=[
    {dim:'leadership',th:65,eff:[{label:'확신 제공',v:18},{label:'개인공간',v:-10}]},

  function computeImpact(a,b){return{aToB:impactOf(a),bToA:impactOf(b)};}
  const MISREAD_RULES=[
    {dim:'contact',gap:35,action:'연락을 자주 하는 것',high:'관심의 표현',low:'부담감'},
    {dim:'boundary',gap:35,action:'선을 긋는 것',high:'자기 존중',low:'거리감'},
    {dim:'leadership',gap:35,action:'결정을 주도하는 것',high:'든든함',low:'답답함'},
  ];
  function findMisreads(a,b,labelA,labelB){
    const out=[];
    for(const r of MISREAD_RULES){
      const av=a[r.dim],bv=b[r.dim];if(av===undefined||bv===undefined)continue;
      if(Math.abs(av-bv)<r.gap)continue;
      const[hi,lo]=av>=bv?[labelA,labelB]:[labelB,labelA];

  }

          catch(e){toast('저장에 실패했어요. 다시 시도해주세요.');return;}

        <div id="fullSection">
          ${locks.map(t=>`<div class="lock"><span class="ic">${lockIco}</span><span class="lt">${t}</span><span class="lk">${lk}</span></div>`).join('')}
          <div class="unlock"><div class="ue">Full Report</div><h3>${meta.nameKo}의 연애, 끝까지 읽어보기</h3><p>10개의 심층 섹션과 18개 수치 전체,<br>나와 맞는·부딪히는 아키타입까지.</p><div class="price"><span class="was">${PRODUCTS.ME_FULL.list.toLocaleString()}원</span><span class="now">${PRODUCTS.ME_FULL.sale.toLocaleString()}</span><span class="cu">원</span></div><button class="ubtn" id="pay">전체 리포트 열기</button><p class="disc" style="color:#B9A0A9;margin-top:12px">1회 결제 · 평생 다시보기</p></div>
        </div>
        <div class="again"><button id="home">처음으로</button><button id="retry">다시 테스트</button></div>
        <p class="disc">이 리포트는 심리 진단이 아닌 자기이해 콘텐츠예요.<br>같은 답변은 항상 같은 결과로 계산됩니다 · ME v1.0</p>
      </section>
    </div>`));
    document.getElementById('home').onclick=()=>{S=null;localStorage.removeItem(KEY);Page='home';render();scrollTop();};
    document.getElementById('retry').onclick=()=>{S=fresh();save(S);render();scrollTop();};
    isUnlocked('ME_FULL').then(unlocked=>{
      if(!unlocked){
        const payBtn=document.getElementById('pay');
        if(payBtn)payBtn.onclick=()=>openSheet(PRODUCTS.ME_FULL,()=>{toast('✓ 잠금 해제됐어요');renderResult();});
        return;
      }
      const fs=document.getElementById('fullSection');if(!fs)return;
      fs.innerHTML=renderFullReport(nc,nl,ch,ins,giveRows,recvRows);
    });
  }
  const LOVE_BLURB={giveWords:'말로 마음을 표현할 때 상대가 가장 크게 느껴요.',giveTime:'함께 보내는 시간 자체가 당신의 사랑 표현이에요.',giveTouch:'스킨십으로 애정을 표현하는 게 자연스러워요.',giveGift:'선물과 기념일로 마음을 표현하는 편이에요.',giveHelp:'필요한 걸 직접 해결해주는 걸로 사랑을 표현해요.',receiveWords:'말로 확인받을 때 가장 크게 사랑받는다고 느껴요.',receiveTime:'함께하는 시간을 내줄 때 사랑을 느껴요.',receiveTouch:'스킨십을 받을 때 사랑을 느끼는 편이에요.',receiveGift:'선물을 받을 때 마음이 크게 느껴져요.',receiveHelp:'실질적으로 도와줄 때 사랑받는다고 느껴요.'};
  function renderFullReport(nc,nl,ch,ins,giveRows,recvRows){
    const topGive=[...giveRows].sort((a,b)=>b.v-a.v)[0],topRecv=[...recvRows].sort((a,b)=>b.v-a.v)[0];
    const giveKey=Object.keys(LLAB).find(k=>k.startsWith('give')&&LLAB[k].includes(topGive.l.split('·')[0]))||'giveWords';
    const recvKey=Object.keys(LLAB).find(k=>k.startsWith('receive')&&LLAB[k].includes(topRecv.l.split('·')[0]))||'receiveWords';
    const all=allSignature(nc);
    const lowest=[...all].sort((a,b)=>a.value-b.value).slice(0,2);
    const types=matchTopTypes(nc);
    const thirdType=types.top3[2];
    const worstType=types.worst;
    const restIns=ins.slice(1);
    return `
      <div class="pattern" style="margin-top:0"><div class="pt">당신이 사랑하는 방식</div><p class="px" style="font-size:14.5px">가장 자주 쓰는 표현은 <b>${topGive.l}</b>이에요. ${LOVE_BLURB[giveKey]}</p></div>
      <div class="pattern"><div class="pt">당신이 사랑받는 방식</div><p class="px" style="font-size:14.5px">가장 크게 느끼는 방식은 <b>${topRecv.l}</b>이에요. ${LOVE_BLURB[recvKey]}</p></div>
      <div class="pattern"><div class="pt">싸웠을 때의 진짜 모습</div><p class="px" style="font-size:14.5px">${BANDS.conflictDirect[band(nc.conflictDirect)]} ${BANDS.cooldown[band(nc.cooldown)]} ${BANDS.emotionExpression[band(nc.emotionExpression)]}</p></div>
      <div class="pattern"><div class="pt">신뢰가 깨졌을 때</div><p class="px" style="font-size:14.5px">${BANDS.trustOpen[band(nc.trustOpen)]} ${BANDS.boundary[band(nc.boundary)]} ${BANDS.repair[band(nc.repair)]}</p></div>
      <div class="pattern"><div class="pt">관계에서 가장 취약한 부분</div><p class="px" style="font-size:14.5px">${lowest.map(d=>`<b>${d.label}</b> — ${d.text}`).join('<br>')}</p></div>
      <div class="pattern"><div class="pt">관계에서의 강점</div><p class="px" style="font-size:14.5px">${META[ch.primary.k].strengths.map(s=>`· ${s}`).join('<br>')}</p></div>
      <div class="pattern"><div class="pt">당신과 잘 맞는 캐릭터 — ${META[thirdType.k].nameKo}</div><p class="px" style="font-size:14.5px">“${META[thirdType.k].tagline}” ${META[thirdType.k].essence}</p></div>
      <div class="pattern"><div class="pt">충돌하기 쉬운 캐릭터 — ${META[worstType.k].nameKo}</div><p class="px" style="font-size:14.5px">“${META[worstType.k].tagline}” 서로 기준이 크게 달라 부딪히는 지점이 많을 수 있어요.</p></div>
      <div class="sh" style="margin-top:20px"><h3>전체 18개 연애 수치</h3></div>
      ${all.map(d=>`<div class="sigrow" style="padding:12px 0"><div class="signum" style="font-size:26px">${d.value}<sup>/100</sup></div><div><div class="siglab">${d.label}</div><p class="sigtext">${d.text}</p></div></div>`).join('')}
      <div class="pattern" style="margin-top:16px"><div class="pt">나를 연애할 때 사용설명서</div><p class="px" style="font-size:14.5px">${[ins[0],...restIns].filter(Boolean).map(r=>`· <b>${r.t}</b> — ${r.x}`).join('<br>')}</p></div>
    `;
  }
  let tt;function toast(m){clearTimeout(tt);let e=document.querySelector('.toast');if(!e){e=$(`<div class="toast"></div>`);document.body.append(e);}e.textContent=m;tt=setTimeout(()=>e.remove(),2200);}

  // ---- 부팅: 초대 링크(#invite=token) / 관리자(#admin) 진입점 처리 ----
  (async function boot(){
    const hash=location.hash;
    if(hash.startsWith('#invite=')){
      inviteToken=hash.slice('#invite='.length);
      history.replaceState(null,'',location.pathname);
      inviteInfo=await resolveInvite(inviteToken).catch(()=>null);
      Page='inviteIntro';
    }else if(hash==='#admin'){
      history.replaceState(null,'',location.pathname);
      Page='admin';
    }
    render();
  })();
})();
</script>

</body></html>
