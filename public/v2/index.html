<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ME 연애 리포트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;
    --ground:#FBF6F1;--surface:#FFF;--ink:#3A2530;--ink-soft:#6E5A61;--muted:#9C8A8F;
    --rose:#C2607A;--rose-deep:#A44863;--blush:#F6E4E8;--gold:#C4A05E;--gold-soft:#E7D3A8;
    --line:#EADFD7;--amber:#C9761B;--amber2:#E9A23B;
    --shadow:0 14px 32px rgba(90,45,60,.10);--shadow-sm:0 6px 18px rgba(90,45,60,.07);}
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:430px;margin:0 auto;padding:0 22px;min-height:100%;}
  .serif{font-family:'Nanum Myeongjo',Georgia,serif}.fr{font-family:'Fraunces',Georgia,serif}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-deep);font-weight:600}
  .gold-rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
  button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
  .btn{display:block;width:100%;text-align:center;border:none;color:#fff;font-weight:600;font-size:16px;
    background:linear-gradient(135deg,var(--rose),var(--rose-deep));padding:17px;border-radius:999px;
    box-shadow:0 12px 26px rgba(164,72,99,.3)}
  .fade{animation:f .28s ease-out}@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}

  /* intro */
  .intro{display:flex;flex-direction:column;min-height:100dvh;text-align:center;padding-block:36px}
  .intro .hero{flex:1;display:flex;flex-direction:column;justify-content:center}
  .kick{display:inline-flex;gap:9px;align-items:center;color:var(--muted);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;justify-content:center}
  .kick::before,.kick::after{content:'';width:20px;height:1px;background:var(--gold);opacity:.7}
  h1.title{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:40px;line-height:1.18;margin:14px 0 0}
  h1.title em{font-style:normal;color:var(--rose-deep)}
  .mark{font-family:'Fraunces',serif;font-weight:600;font-size:15px;letter-spacing:.5em;color:var(--rose-deep);margin-top:6px}
  .sub{margin:18px auto 0;max-width:19em;color:var(--ink-soft);font-size:15px;line-height:1.85}
  .sub b{color:var(--ink);font-weight:600}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 6px;box-shadow:var(--shadow-sm)}
  .stat .n{font-family:'Fraunces',serif;font-weight:600;font-size:28px}.stat .l{margin-top:6px;font-size:11px;color:var(--muted)}

  /* quiz */
  .pbar{position:sticky;top:0;background:var(--ground);padding:20px 0 14px;z-index:5}
  .pmeta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .pcur{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--rose-deep)}
  .pcur small{color:var(--muted);font-weight:400}.ppct{font-size:11px;letter-spacing:.2em;color:var(--muted)}
  .track{height:2px;background:var(--line);border-radius:2px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .3s}
  .cat{margin:24px 0 12px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--rose-deep);font-weight:600}
  h2.q{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;line-height:1.42;margin:0 0 24px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px;width:100%;transition:all .15s}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:'Fraunces',serif;font-weight:600;font-size:13px;background:var(--blush);color:var(--rose-deep);margin-top:1px}
  .opt .t{font-size:14.5px;line-height:1.6;color:var(--ink)}
  .opt.sel{border-color:var(--rose);background:linear-gradient(180deg,#fff,var(--blush));box-shadow:var(--shadow)}
  .opt.sel .k{background:var(--rose);color:#fff}
  .otherbtn{margin-top:14px;width:100%;border:1px dashed #E0B9C4;color:var(--rose-deep);font-weight:500;font-size:13.5px;border-radius:16px;padding:13px;background:transparent}
  .otherbox{margin-top:12px;background:var(--blush);border:1px solid #E6CBD3;border-radius:16px;padding:14px}
  .otherbox p{margin:0 0 8px;font-size:12.5px;color:var(--ink-soft)}
  .otherbox textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:13.5px;resize:none}
  .nav{position:sticky;bottom:0;background:rgba(251,246,241,.95);backdrop-filter:blur(8px);border-top:1px solid var(--line);margin:20px -22px 0;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px))}
  .navin{display:flex;gap:11px}
  .prev{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:999px;padding:14px 22px;font-weight:500;font-size:14px}
  .next{flex:1;border:none;color:#fff;border-radius:999px;padding:14px;font-weight:600;font-size:15px;background:linear-gradient(135deg,var(--rose),var(--rose-deep));box-shadow:0 10px 22px rgba(164,72,99,.28)}
  .next:disabled{opacity:.4}

  /* intermission */
  .inter{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70dvh;text-align:center}
  .inter .em{font-size:60px;margin-bottom:16px}.inter h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:24px;margin:0 0 8px}
  .inter p{color:var(--muted);margin:0 0 28px;max-width:16em}

  /* result */
  section.rs{padding:30px 0;border-top:1px solid var(--line)}
  .cover{padding:34px 0 28px;text-align:center}
  .emblem{width:92px;height:92px;margin:22px auto 0;border-radius:50%;position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
  .emblem::after{content:'';position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,255,255,.45)}
  .emblem span{font-family:'Fraunces',serif;font-weight:600;font-size:42px;color:#fff;position:relative;text-shadow:0 2px 8px rgba(120,60,10,.35)}
  .aen{margin-top:18px;font-family:'Fraunces',serif;font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase}
  .ako{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:50px;line-height:1.05;margin:6px 0 0}
  .atag{margin:14px 0 0;font-family:'Nanum Myeongjo',serif;font-size:17px;font-style:italic;color:var(--ink-soft)}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .chip{font-size:11.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;box-shadow:var(--shadow-sm)}
  .chip b{color:var(--rose-deep)}.chip .fr{color:var(--ink);font-weight:600}
  .pull{font-family:'Nanum Myeongjo',serif;font-size:21px;line-height:1.6;color:var(--ink)}
  .pull .qq{color:var(--gold);font-size:30px;font-family:'Fraunces',serif;vertical-align:-6px}
  .ess{margin-top:14px;color:var(--ink-soft);font-size:14.5px;line-height:1.9}
  .sh{display:flex;align-items:center;gap:12px;margin:0 0 16px}
  .sh .no{font-family:'Fraunces',serif;font-size:12px;color:var(--gold)}.sh h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:19px;margin:0}
  .signote{color:var(--muted);font-size:12.5px;margin:-6px 0 18px}
  .sigrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
  .sigrow:last-child{border-bottom:none}
  .signum{font-family:'Fraunces',serif;font-weight:600;font-size:44px;line-height:.9}
  .signum sup{font-size:14px;font-weight:500;color:var(--muted)}
  .siglab{font-weight:600;font-size:15px}.sigbadge{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:999px;font-weight:600;margin-left:8px}
  .bd-high{background:var(--blush);color:var(--rose-deep)}.bd-low{background:#EAEEF3;color:#5E6C82}
  .sigtext{margin:7px 0 0;color:var(--ink-soft);font-size:13.5px;line-height:1.6}
  .contrast{margin-top:16px;background:#F6EFE7;border:1px solid #ECDCC6;border-radius:14px;padding:13px 15px;font-size:12.5px;color:var(--ink-soft);line-height:1.7}
  .contrast b{color:var(--ink)}
  .freetag{font-family:'Fraunces',serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .pattern{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .pattern .pt{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:16px;color:var(--rose-deep)}
  .pattern .px{margin:10px 0 0;font-family:'Nanum Myeongjo',serif;font-size:18px;line-height:1.6;color:var(--ink)}
  .lovehead{display:flex;gap:14px;align-items:center;margin-bottom:16px}.lovehead .em{font-size:32px}
  .lovehead .bg{font-family:'Fraunces',serif;font-weight:600;font-size:15px}.lovehead p{margin:3px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.55}
  .lg h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:14px 0 10px;font-weight:600}
  .bar{display:grid;grid-template-columns:74px 1fr 30px;gap:10px;align-items:center;margin-bottom:9px}
  .bar .bl{font-size:12.5px;color:var(--ink-soft)}.bar .tk{height:7px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar .fl{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--rose-deep))}
  .bar.top .fl{background:linear-gradient(90deg,var(--amber2),var(--amber))}
  .bar .bv{font-family:'Fraunces',serif;font-size:13px;text-align:right}.bar.zero .bl,.bar.zero .bv{color:#C4B3B8}
  .lock{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:9px}
  .lock .ic{flex:none;width:28px;height:28px;border-radius:8px;background:#F1E7EC;display:grid;place-items:center;color:var(--rose-deep)}
  .lock .lt{font-size:14px;font-weight:500}.lock .lk{margin-left:auto;color:var(--muted)}
  .unlock{margin-top:20px;border-radius:22px;padding:26px 22px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#2E1D26,#43222F);box-shadow:0 20px 44px rgba(58,30,45,.34)}
  .unlock .ue{font-family:'Fraunces',serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-soft)}
  .unlock h3{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;margin:12px 0 0;color:#fff}
  .unlock p{margin:12px 0 0;font-size:13px;color:#E9D9DF;line-height:1.7}
  .price{margin:18px 0 2px}.price .was{color:#B9A0A9;text-decoration:line-through;font-size:14px;margin-right:8px}
  .price .now{font-family:'Fraunces',serif;font-weight:600;font-size:30px;color:#fff}.price .cu{font-size:14px;color:#E9D9DF;margin-left:2px}
  .ubtn{margin-top:16px;width:100%;border:none;border-radius:999px;padding:15px;font-weight:700;font-size:15px;color:var(--ink);background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .again{margin-top:18px;display:flex;gap:10px}
  .again button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:14px;padding:13px;font-weight:500;font-size:13.5px}
  .disc{margin-top:22px;text-align:center;font-size:11px;color:var(--muted);line-height:1.7}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:40}
</style>

      let pool=rem.filter(x=>x.c!==prev); if(!pool.length)pool=rem;
      pool.sort((a,z)=>z.left-a.left||cats.indexOf(a.c)-cats.indexOf(z.c));
      const pick=pool[0].c;order.push(b[pick][cur[pick]++]);prev=pick;
    }
    return order;
  }
  // ---- state ----
  function fresh(){return {answers:{},idx:0,order:buildOrder(),inter:null};}
  function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.order&&s.order.length===Q.length)return s;}catch(e){}return null;}
  function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
  let S=load();

  // ---- 계산 ----
  function ranges(keys){const mn={},mx={};keys.forEach(k=>{mn[k]=0;mx[k]=0;});
    Q.forEach(q=>{keys.forEach(k=>{const v=q.options.map(o=>+(o.score[k]||0));mn[k]+=Math.min(...v);mx[k]+=Math.max(...v);});});return{mn,mx};}
  function raw(keys){const r={};keys.forEach(k=>r[k]=0);
    Object.entries(S.answers).forEach(([qid,a])=>{const q=qById[qid];if(!q)return;const opt=q.options.find(o=>o.id===a.optionId);if(!opt)return;keys.forEach(k=>r[k]+=+(opt.score[k]||0));});return r;}
  function norm(keys){const rg=ranges(keys),rw=raw(keys),n={};keys.forEach(k=>{const lo=rg.mn[k],hi=rg.mx[k];let v=hi===lo?50:((rw[k]-lo)/(hi-lo))*100;n[k]=Math.max(0,Math.min(100,v));});return n;}
  function band(v){return v<=20?0:v<=40?1:v<=60?2:v<=80?3:4;}
  function rms(a,b){let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d;}return Math.sqrt(s/a.length);}
  function classify(nc){const uv=CK.map(k=>nc[k]);
    const rank=Object.entries(CENT).map(([k,c])=>({k,label:c.label,dist:rms(uv,c.vector)})).sort((a,b)=>a.dist-b.dist);
    rank.forEach(r=>r.sim=Math.max(0,Math.min(100,100-r.dist)));
    const gap=rank[1].dist-rank[0].dist;const blend=gap<2?'복합형':gap<5?'혼합형':gap<9?'뚜렷한 편':'뚜렷한 유형';
    return{primary:rank[0],secondary:rank[1],blend,rank};}
  function signature(nc){
    const e=CK.map(k=>({k,value:nc[k],dist:Math.abs(nc[k]-50),band:band(nc[k])}));
    const highs=e.filter(x=>x.band>=3).sort((a,b)=>b.value-a.value);
    const lows=e.filter(x=>x.band<=1).sort((a,b)=>a.value-b.value);
    const byd=[...e].sort((a,b)=>b.dist-a.dist||CK.indexOf(a.k)-CK.indexOf(b.k));
    const ch=[],add=x=>{if(x&&!ch.find(c=>c.k===x.k))ch.push(x);};
    add(highs[0]);add(lows[0]);byd.forEach(x=>{if(ch.length<3)add(x);});
    return ch.slice(0,3).map(x=>({label:CLAB[x.k],value:Math.round(x.value),dir:x.band>=3?'high':x.band<=1?'low':'mid',text:BANDS[x.k][x.band]}));
  }
  const RULES=[
    {id:'a',t:'가까움과 거리, 둘 다',c:[['intimacy','h'],['personalSpace','h']],x:'깊게 사랑하고 싶지만, 사랑한다고 항상 붙어 있어야 한다고 생각하지는 않습니다.'},
    {id:'b',t:'확인은 필요하지만 표현은 아껴요',c:[['reassurance','h'],['emotionExpression','l']],x:'상대의 표현은 많이 필요하지만 자신의 감정은 상대적으로 덜 드러내는 편입니다.'},
    {id:'c',t:'피하진 않지만 서두르지도 않아요',c:[['conflictDirect','h'],['cooldown','h']],x:'문제를 피하지는 않지만 감정이 정리되지 않은 상태에서 바로 싸우는 것도 원하지 않습니다.'},
    {id:'d',t:'위로보다 해결이 먼저',c:[['solution','h'],['empathy','l']],x:'상대가 힘들어하면 위로보다 해결 방법이 먼저 떠오르는 편입니다.'},
    {id:'e',t:'쉽게 믿진 않지만 쉽게 포기도 안 해요',c:[['trustOpen','l'],['repair','h']],x:'쉽게 믿지는 않지만 한번 관계를 시작하면 쉽게 포기하지 않는 편입니다.'},
    {id:'f',t:'선은 분명하게',c:[['boundary','h'],['flexibility','l']],x:'맞춰줄 수 있는 부분은 많지만, 한번 정한 선만큼은 잘 양보하지 않습니다.'},
    {id:'g',t:'방향을 잡는 사람',c:[['leadership','h'],['solution','h']],x:'관계가 흔들릴 때 방향을 제시하고 문제를 정리하는 역할을 자주 맡습니다.'},
    {id:'h',t:'멀리 보는 안정',c:[['future','h'],['stability','h']],x:'지금의 설렘만큼이나 이 관계가 오래 안정적으로 갈 수 있는지를 중요하게 봅니다.'},
    {id:'i',t:'연결되고 싶지만 통제는 싫어요',c:[['contact','h'],['privacy','h']],x:'자주 연결되어 있고 싶지만, 그것이 서로를 확인하고 통제하는 방식이 되는 건 원하지 않습니다.'},
    {id:'j',t:'맞춰주는 다정함',c:[['empathy','h'],['flexibility','h']],x:'상대의 감정을 먼저 읽고, 부딪히기보다 맞춰가며 관계를 부드럽게 유지합니다.'}
  ];
  function insights(nc){return RULES.filter(r=>r.c.every(([k,d])=>d==='h'?band(nc[k])>=3:band(nc[k])<=1));}

  // ---- 렌더 ----
  function scrollTop(){window.scrollTo(0,0);}
  function render(){

  function renderIntro(){

  function renderQuiz(){
    const qid=S.order[S.idx],q=qById[qid],a=S.answers[qid];

    el.querySelector('#ob').onclick=()=>{
      const box=el.querySelector('#obox');
      if(box.innerHTML){box.innerHTML='';return;}
      box.innerHTML=`<div class="otherbox fade"><p>딱 맞는 답이 없으면 자유롭게 적고, <b>가장 가까운 A~D</b>를 함께 골라주세요. (점수는 고른 선택지로 계산돼요)</p><textarea id="ta" placeholder="내 생각을 적어주세요">${(a&&a.other)||''}</textarea></div>`;
      const ta=box.querySelector('#ta');
      ta.oninput=()=>{const cur=S.answers[qid]||{};cur.other=ta.value;S.answers[qid]=cur;save(S);};
    };
    el.querySelector('#prev').onclick=()=>{if(S.idx>0){S.idx--;save(S);renderQuiz();scrollTop();}};
    el.querySelector('#next').onclick=()=>{
      if(!(S.answers[qid]&&S.answers[qid].optionId))return;
      if(isLast){S.done=true;save(S);renderResult();scrollTop();return;}
      S.idx++;save(S);
      if(S.idx%10===0&&S.idx<Q.length){S.inter=S.idx;save(S);renderInter();scrollTop();}
      else{renderQuiz();scrollTop();}
    };
  }
  function renderInter(){
    const n=S.inter;const msg={10:['🌱','10개 완료!','편하게 계속 가볼까요?'],20:['🌤️','절반 가까이 왔어요','지금 느낌 그대로면 충분해요.'],30:['🔥','30개 돌파!','조금만 더 하면 결과가 보여요.'],40:['🏁','마지막 스퍼트','5문항만 더!']}[n]||['✨',n+'개 완료!','계속 가볼까요?'];
    app.innerHTML='';
    const el=$(`<div class="inter fade"><div class="em">${msg[0]}</div><h3>${msg[1]}</h3><p>${msg[2]}</p><button class="btn" style="max-width:220px" id="cont">계속하기</button></div>`);
    app.append(el);el.querySelector('#cont').onclick=()=>{S.inter=null;save(S);renderQuiz();scrollTop();};

  function renderResult(){
    const nc=norm(CK), nl=norm(LK);

    const [g0,g1]=meta.gradient;
    const parts=meta.essence.split(/(?<=다\.)\s+/); const lead=parts[0], body=parts.slice(1).join(' ');
    // love dominant

    const lockIco=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:14px;height:14px"><path d="M12 3s7 2 7 9-4 8-7 9c-3-1-7-3-7-9s7-9 7-9z"/></svg>`;
    const lk=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:15px;height:15px"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
    const sigHtml=sig.map(d=>`<div class="sigrow"><div class="signum" style="color:${d.dir==='low'?'#7C8BA1':'#A44863'}">${d.value}<sup>/100</sup></div><div><div><span class="siglab">${d.label}</span>${d.dir==='high'?'<span class="sigbadge bd-high">매우 높음</span>':d.dir==='low'?'<span class="sigbadge bd-low">매우 낮음</span>':''}</div><p class="sigtext">${d.text}</p></div></div>`).join('');
    const high=sig.find(d=>d.dir==='high'),low=sig.find(d=>d.dir==='low');
    app.innerHTML='';
    app.append($(`<div class="fade" style="overflow:hidden">
      <section class="cover" style="border:none">
        <span class="eyebrow" style="color:var(--muted);font-size:10.5px">My Love Archetype</span>

      ${pat?`<section class="rs"><div class="sh"><span class="no">02</span><h3>연애에서 반복하기 쉬운 패턴</h3></div><span class="freetag">✦ Free Preview</span><div class="pattern"><div class="pt">${pat.t}</div><p class="px">${pat.x}</p></div>${ins.length>1?`<p class="disc" style="margin-top:12px">전체 리포트엔 패턴 <b style="color:var(--rose-deep)">${ins.length-1}가지</b>가 더 있어요</p>`:''}</section>`:''}
      <section class="rs"><div class="sh"><span class="no">03</span><h3>사랑을 전하고 받는 방식</h3></div>
        <div class="lovehead"><div class="em">${dom[3]}</div><div><div class="bg">당신의 사랑 언어 · ${dom[0]}</div><p>여러 방식 중 <b style="color:var(--ink)">${dom[0]}</b>(으)로 사랑을 전하고 또 그렇게 받을 때 가장 사랑받는다고 느껴요.</p></div></div>

        <div class="unlock"><div class="ue">Full Report</div><h3>${meta.nameKo}의 연애, 끝까지 읽어보기</h3><p>10개의 심층 섹션과 18개 수치 전체,<br>나와 맞는·부딪히는 아키타입까지.</p><div class="price"><span class="was">9,900원</span><span class="now">4,900</span><span class="cu">원</span></div><button class="ubtn" id="pay">전체 리포트 열기</button><p class="disc" style="color:#B9A0A9;margin-top:12px">1회 결제 · 평생 다시보기</p></div>
        <div class="again"><button id="home">처음으로</button><button id="retry">다시 테스트</button></div>
        <p class="disc">이 리포트는 심리 진단이 아닌 자기이해 콘텐츠예요.<br>같은 답변은 항상 같은 결과로 계산됩니다 · ME v1.0</p>
      </section>
    </div>`));
    document.getElementById('pay').onclick=()=>toast('결제 화면 미리보기예요 🙂 (데모)');
    document.getElementById('home').onclick=()=>{S=null;localStorage.removeItem(KEY);render();scrollTop();};
    document.getElementById('retry').onclick=()=>{S=fresh();save(S);render();scrollTop();};
  }
  let tt;function toast(m){clearTimeout(tt);let e=document.querySelector('.toast');if(!e){e=$(`<div class="toast"></div>`);document.body.append(e);}e.textContent=m;tt=setTimeout(()=>e.remove(),2200);}

  render();
})();
