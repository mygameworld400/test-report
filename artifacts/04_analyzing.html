<title>ME 분석 중 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ground:#FBF6F1;--surface:#FFFFFF;--ink:#3A2530;--ink-soft:#6E5A61;
    --muted:#9C8A8F;--rose:#C2607A;--rose-deep:#A44863;--blush:#F6E4E8;
    --gold:#C4A05E;--line:#EADFD7;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:radial-gradient(120% 70% at 50% 30%, #FCEDE9, var(--ground) 60%);
    color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .frame{max-width:430px;margin:0 auto;height:100%;padding:0 26px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .serif{font-family:'Nanum Myeongjo',Georgia,serif;}
  .eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--rose-deep);font-weight:600;}

  .ring{position:relative;width:150px;height:150px;margin:26px 0 30px;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .bg{fill:none;stroke:var(--line);stroke-width:2}
  .ring .fg{fill:none;stroke:url(#g);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:295;stroke-dashoffset:44;}
  .ring .emblem{position:absolute;inset:0;display:grid;place-items:center;}
  .ring .emblem .pct{font-family:'Fraunces',serif;font-weight:600;font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .ring .emblem .pl{font-size:10px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:2px;}
  .spin{position:absolute;inset:-7px;border-radius:50%;
    border:1.5px dashed rgba(196,160,94,.5);animation:spin 14s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  h1{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:27px;line-height:1.4;margin:0;text-wrap:balance;}
  .sub{margin:14px 0 0;color:var(--ink-soft);font-size:14px;line-height:1.8;max-width:20em;}

  .steps{margin-top:34px;width:100%;max-width:300px;display:flex;flex-direction:column;gap:2px;text-align:left;}
  .step{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(234,223,215,.7);}
  .step:last-child{border-bottom:none}
  .step .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;}
  .done .ic{background:var(--rose);}
  .done .ic svg{width:12px;height:12px;color:#fff}
  .active .ic{border:2px solid var(--rose);position:relative}
  .active .ic::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--rose);
    animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .todo .ic{border:2px solid var(--line)}
  .step .tx{font-size:13.5px;color:var(--ink);}
  .todo .tx{color:var(--muted)}
  .step .tag{margin-left:auto;font-family:'Fraunces',serif;font-size:11px;color:var(--muted);letter-spacing:.05em;}

  .foot{margin-top:30px;font-size:11.5px;color:var(--muted);letter-spacing:.02em;}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}.active .ic::after{animation:none}}
</style>

<div class="frame">
  <span class="eyebrow">Analyzing</span>

  <div class="ring">
    <div class="spin"></div>
    <svg viewBox="0 0 100 100">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C4A05E"/><stop offset="1" stop-color="#A44863"/>
      </linearGradient></defs>
      <circle class="bg" cx="50" cy="50" r="47"/>
      <circle class="fg" cx="50" cy="50" r="47"/>
    </svg>
    <div class="emblem"><div><div class="pct">85</div><div class="pl">%</div></div></div>
  </div>

  <h1>당신의 연애를<br>한 줄씩 읽는 중</h1>
  <p class="sub">45개의 답을 모아 나만의 패턴을 계산하고 있어요. 잠시만요.</p>

  <div class="steps">
    <div class="step done"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span><span class="tx">45개 답변 정리</span><span class="tag">45 / 45</span></div>
    <div class="step done"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></span><span class="tx">18개 연애 수치 계산</span><span class="tag">done</span></div>
    <div class="step active"><span class="ic"></span><span class="tx">12개 아키타입과 비교</span><span class="tag">…</span></div>
    <div class="step todo"><span class="ic"></span><span class="tx">나의 리포트 구성</span><span class="tag">soon</span></div>
  </div>

  <div class="foot">ME · Love Personality Report</div>
</div>
